<style>
:root {
  {{ if .Site.Params.backgroundImage }}
  --background-image: {{ .Site.Params.backgroundImage }};
  {{ end }}
  {{ if .Site.Params.contentPanelWidth }}
  --content-panel-width: {{ .Site.Params.contentPanelWidth }};
  {{ end }}
  {{ if .Site.Params.panelBackgroundColor }}
  --panel-bg-color: {{ .Site.Params.panelBackgroundColor }};
  {{ end }}
  {{ if .Site.Params.panelShadowColor }}
  --panel-shadow-color: {{ .Site.Params.panelShadowColor }};
  {{ end }}
}
</style>
<!-- Archive filter rules for site-specific content types -->
<style>
.archives-list[data-filter="blogs"] .archive-item:not(.archive-blogs),
.archives-list[data-filter="projects"] .archive-item:not(.archive-projects),
.archives-list[data-filter="research"] .archive-item:not(.archive-research) {
  display: none;
}
.archives-list[data-filter="blogs"] .archive-month-block:not([data-types~="blogs"]),
.archives-list[data-filter="projects"] .archive-month-block:not([data-types~="projects"]),
.archives-list[data-filter="research"] .archive-month-block:not([data-types~="research"]) {
  display: none;
}
.archives-list[data-filter="blogs"] .archive-year-block:not([data-types~="blogs"]),
.archives-list[data-filter="projects"] .archive-year-block:not([data-types~="projects"]),
.archives-list[data-filter="research"] .archive-year-block:not([data-types~="research"]) {
  display: none;
}
</style>

<!-- MathJax Configuration -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
